<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found — Salma Ahmed</title>
  <style>
    :root{--bg:#f8f3fb;--paper:#fffdfd;--ink:#291438;--soft:#665772;--jade:#1f7355;--rose:#d978a5;--line:rgba(41,20,56,.12)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 8% 8%,rgba(217,120,165,.14),transparent 28rem),radial-gradient(circle at 92% 25%,rgba(47,152,115,.15),transparent 30rem),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;text-align:center}
    main{max-width:620px;background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:52px 34px;box-shadow:0 18px 55px rgba(70,35,91,.10)}
    .seal{width:58px;height:58px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;color:white;font-weight:800;background:linear-gradient(135deg,#1f7355,#d978a5)}
    h1{margin:0 0 12px;font:700 clamp(48px,10vw,78px)/1 'Georgia',serif} h2{margin:0 0 12px;font:700 34px/1.1 'Georgia',serif} p{color:var(--soft);line-height:1.7;margin:0 auto 24px;max-width:48ch}
    a{display:inline-flex;padding:12px 20px;border-radius:999px;background:var(--jade);color:white;text-decoration:none;font-weight:700} a:hover{transform:translateY(-1px)}
  </style>
</head>
<body>
  <main>
    <div class="seal">SA</div>
    <h1>404</h1>
    <h2>Looks like this page went off course.</h2>
    <p>The page you're looking for doesn't exist or may have moved. Let's get you back to the portfolio.</p>
    <a href="/">Back to Salma's portfolio</a>
  </main>
</body>
</html>
